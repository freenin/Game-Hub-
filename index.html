<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Hub</title><style>body{margin:0;background:#10131a;color:white;font-family:Arial;text-align:center}header{padding:30px;background:#171c27}h1{font-size:42px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:900px;margin:30px auto;padding:20px}.card{background:#1c2230;padding:25px;border-radius:18px}.icon{font-size:55px}button{padding:12px 25px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}#game{display:none;margin:20px auto;max-width:620px}canvas{background:#07090d;border-radius:12px;max-width:100%}</style></head><body><header><h1>🎮 GAME HUB</h1><p>Play games right in your browser!</p></header><main id="home" class="grid"><div class="card"><div class="icon">🐍</div><h2>Snake</h2><p>Eat the food. Grow. Don't crash.</p><button onclick="snake()">PLAY</button></div><div class="card"><div class="icon">🧱</div><h2>Block Dodge</h2><p>Dodge the falling blocks.</p><button onclick="dodge()">PLAY</button></div><div class="card"><div class="icon">🎯</div><h2>Click Rush</h2><p>Click the target as many times as you can in 20 seconds.</p><button onclick="rush()">PLAY</button></div></main><section id="game"><button onclick="home()">← Back</button><h2 id="title"></h2><p id="score"></p><canvas id="c" width="600" height="420"></canvas><p id="help"></p></section><script>const H=document.getElementById('home'),G=document.getElementById('game'),C=document.getElementById('c'),x=C.getContext('2d'),S=document.getElementById('score');let timer,keys={};function show(t,h){H.style.display='none';G.style.display='block';document.getElementById('title').textContent=t;document.getElementById('help').textContent=h;clearInterval(timer)}function home(){clearInterval(timer);G.style.display='none';H.style.display='grid'}function snake(){show('🐍 Snake','Arrow keys or WASD');let a=[{x:10,y:10}],d={x:1,y:0},f={x:15,y:10},sc=0;function tick(){let q={x:a[0].x+d.x,y:a[0].y+d.y};if(q.x<0||q.y<0||q.x>=30||q.y>=21||a.some(p=>p.x==q.x&&p.y==q.y)){alert('Game over! Score: '+sc);return snake()}a.unshift(q);if(q.x==f.x&&q.y==f.y){sc++;S.textContent='Score: '+sc;f={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*21)}}else a.pop();x.clearRect(0,0,600,420);x.fillStyle='white';a.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18));x.fillStyle='lime';x.fillRect(f.x*20,f.y*20,18,18)}document.onkeydown=e=>{if((e.key=='ArrowUp'||e.key=='w')&&d.y==0)d={x:0,y:-1};if((e.key=='ArrowDown'||e.key=='s')&&d.y==0)d={x:0,y:1};if((e.key=='ArrowLeft'||e.key=='a')&&d.x==0)d={x:-1,y:0};if((e.key=='ArrowRight'||e.key=='d')&&d.x==0)d={x:1,y:0}};timer=setInterval(tick,110)}function dodge(){show('🧱 Block Dodge','Use Arrow keys or A/D');let p=280,obs=[],sc=0;timer=setInterval(()=>{if(Math.random()<.04)obs.push({x:Math.random()*570,y:-25,v:3+Math.random()*4});if(keys.l)p-=7;if(keys.r)p+=7;p=Math.max(0,Math.min(560,p));obs.forEach(o=>o.y+=o.v);obs=obs.filter(o=>o.y<430);x.clearRect(0,0,600,420);x.fillStyle='white';x.fillRect(p,380,40,20);x.fillStyle='tomato';obs.forEach(o=>x.fillRect(o.x,o.y,30,25));sc++;S.textContent='Score: '+sc;if(obs.some(o=>o.x<p+40&&o.x+30>p&&o.y<400&&o.y+25>380)){alert('Game over! Score: '+sc);dodge()}},20)}function rush(){show('🎯 Click Rush','Click the target!');let sc=0,end=Date.now()+20000;function draw(){let left=Math.max(0,end-Date.now());if(!left){alert('Time! Score: '+sc);return home()}x.clearRect(0,0,600,420);x.fillStyle='white';x.font='28px Arial';x.fillText('TIME: '+Math.ceil(left/1000),20,40);x.beginPath();x.arc(100+Math.random()*400,100+Math.random()*260,30,0,7);x.fill()}C.onclick=()=>{sc++;S.textContent='Score: '+sc};timer=setInterval(draw,250);draw()}document.onkeydown=e=>{keys.l=e.key=='ArrowLeft'||e.key=='a';keys.r=e.key=='ArrowRight'||e.key=='d'};document.onkeyup=e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=false;if(e.key=='ArrowRight'||e.key=='d')keys.r=false};</script></body></html>
